name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1

jobs:
  build-test:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore FractalMemory.sln
      - run: dotnet build FractalMemory.sln --configuration Release --no-restore -warnaserror
      - name: Test
        if: matrix.os != 'ubuntu-latest'
        run: dotnet test --solution FractalMemory.sln --configuration Release --no-build
      - name: Test with coverage
        if: matrix.os == 'ubuntu-latest'
        run: >-
          dotnet test --solution FractalMemory.sln --configuration Release --no-build
          --coverage --coverage-output-format cobertura --results-directory TestResults
      - name: Install source checkout and run pilot demo
        shell: pwsh
        run: |
          python scripts/install-local.py --tool-dir "$env:RUNNER_TEMP/fractalmem pilot tools"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $cli = if ($IsWindows) { 'fm.exe' } else { 'fm' }
          python scripts/demo.py --cli "$env:RUNNER_TEMP/fractalmem pilot tools/$cli"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v7.0.1
        if: matrix.os == 'ubuntu-latest'
        with:
          name: coverage
          path: TestResults/*.cobertura.xml
          if-no-files-found: error

  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore FractalMemory.sln
      - name: Fail on known NuGet vulnerabilities
        shell: bash
        run: |
          dotnet package list --project FractalMemory.sln --vulnerable --include-transitive --format json --no-restore > vulnerabilities.json
          count=$(jq '[.. | objects | .vulnerabilities? // empty | length] | add // 0' vulnerabilities.json)
          test "$count" -eq 0

  package-smoke:
    name: Package and MCP smoke test
    runs-on: ubuntu-latest
    needs: [build-test]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore FractalMemory.sln
      - run: dotnet build FractalMemory.sln --configuration Release --no-restore -warnaserror
      - run: dotnet pack FractalMemory.sln --configuration Release --no-build --output artifacts
      - name: Install packages and exercise CLI plus MCP
        shell: bash
        run: |
          version=$(sed -n 's/.*<VersionPrefix>\([^<]*\)<.*/\1/p' Directory.Build.props)
          bash scripts/smoke-packages.sh artifacts "$version"
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: nuget-packages
          path: |
            artifacts/*.nupkg
            artifacts/*.snupkg
          if-no-files-found: error
