id: C1
category: handoff-resume
project: fractal-memory-cli
prompt: "Create and resume from the latest Fractal handoff."
gold_standard:
  - uses the latest Fractal handoff
  - recovers current goal and next actions
must_recover:
  - latest fractal handoff
  - benchmark harness scaffold
  - regression tests
useful_to_recover:
  - CSV JSON and Markdown
  - optional MemoryBench alignment
distractors:
  - GovOS session handling
  - FlowOne selectors
success_criteria:
  - mention scoring reporting or tests
expected_paths:
  - projects/fractal-memory-cli
  - handoffs/latest-fractal-memory-cli.md
answer_rubric:
  expected_phrases:
    - latest fractal handoff
    - benchmark harness scaffold
    - regression tests
  forbidden_phrases:
    - GovOS session handling
    - FlowOne selectors
  unsupported_claim_patterns:
    - "already completed all benchmark work.*"
short_answer_target:
  project_branch: "Fractal Memory CLI"
  current_objective: "Resume from the latest Fractal handoff."
  key_prior_decision: "The benchmark harness scaffold still needs scoring, reporting, and regression tests."
  active_constraint: "Stay deterministic and local-first."
  next_best_action: "Finish scoring, reporting, and regression tests."
  missing_information: "Anything not included in the latest handoff or retrieved project memory."
