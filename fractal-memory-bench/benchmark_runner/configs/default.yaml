approaches:
  - fractal_cli
  - flat_folders
  - single_file
task_ids:
  - A1
  - A2
  - A3
  - B2
  - B3
  - C1
  - D1
repetitions: 1
simulate_reset: true
randomize_task_order: false
random_seed: 13
output_directory: benchmark_runner/outputs
corpus_directory: benchmark_runner/corpus
tasks_directory: benchmark_runner/tasks
use_memorybench_if_available: false
max_files_per_retrieval: 4
fractal_cli_use_live_cli: true
standard_benchmarks:
  enabled: false
  backend: memorybench
  memorybench:
    mode: subprocess
    executable: bun
    working_dir: ./vendor/memorybench
    timeout_seconds: 3600
    preserve_raw_outputs: true
    skip_if_unavailable: true
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY}
    runs:
      - benchmark: locomo
        evaluator: gpt-4o
        provider: fractalmemory
        answering_model: gpt-4o
        limit: 10
      - benchmark: longmemeval
        evaluator: gpt-4o
        provider: fractalmemory
        answering_model: gpt-4o
        limit: 10
