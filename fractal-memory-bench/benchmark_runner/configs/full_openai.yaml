mode: hybrid
approaches:
  - fractal_cli
  - flat_folders
  - single_file
  - no_persistence
  - auto_retrieval_stub
task_ids: []
repetitions: 3
simulate_reset: true
randomize_task_order: true
random_seed: 13
output_directory: benchmark_runner/outputs
corpus_directory: benchmark_runner/corpus
tasks_directory: benchmark_runner/tasks
use_memorybench_if_available: false
max_files_per_retrieval: 4
fractal_cli_use_live_cli: true
llm:
  enabled: true
  provider: openai
  model: gpt-5.4
  temperature: 0
  max_tokens: 220
  timeout_seconds: 60
  save_full_prompts: true
  save_full_responses: true
providers:
  openai:
    api_key_env: OPENAI_API_KEY
answer_scoring:
  enabled: true
  use_llm_judge: false
  use_rule_based_scorer: true
